        <!--JAVASCRIPT TO HANDLE HTML FORM-->
        <script type="module">
            //--------------------------------------------------------
            // Supabase client setup – Setup the connection between client - server
            //--------------------------------------------------------
            // Import the Supabase client library and create a client instance
            import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
            // Replace with your Supabase project URL
            const supabaseUrl = 'https://ieauibjpemdfmktrzvkk.supabase.co';
            // Replace with your Supabase project API key
            const supabaseKey = 'sb_publishable_E18dY44Azi4B1_igqqpqpw_Y4XkO4wY';
            // Create a Supabase client instance
            const supabase = createClient(supabaseUrl, supabaseKey);
            //--------------------------------------------------------
            // Handle form submission and insert data into Supabase
            //--------------------------------------------------------
            //Get the form element by its name
            const form = document.forms['surveyform'];
            //Add an event listener to the form for the 'submit' event
            form.addEventListener('submit', async(e) => {
                //Prevent the default form submission behavior
                e.preventDefault();
                //Get the values from the form fields
                const fname = document.getElementById('fname').value;
                const lname = document.getElementById('lname').value;
                const gender = document.querySelector('input[name="gridRadios"]:checked').value;
                const adr1 = document.getElementById('adr1').value;
                const adr2 = document.getElementById('adr2').value;
                const city = document.getElementById('city').value;
                const phonebrand = document.querySelector('input[name="gridCheck"]:checked').value;
                const phoneprovider = document.getElementById('provider').value;
                const studyphone = document.getElementById('explain').value;
                console.log('data: ' + fname + ' ' + lname + ' ' + gender + adr1 + adr2 + city + phonebrand + phoneprovider + studyphone);
                //Validate the form data (you can add more validation as needed)
                if (!fname || !lname || !gender || !adr1 || !city || !phonebrand || !phoneprovider) {
                    alert('Please fill in all fields.');
                    return;
                }
            //Authenticate the user with Supabase (replace with your own email and password)
            const email = 'sampsm2@student.eit.ac.nz'; // Replace with your email
            const password = '213#Eit2026'; // Replace with your password
            // Handle the authentication result
            authenticateUser(email, password).then((data) => {
                    //If authentication is successful, you can proceed with inserting the data into DB
                    //Call below function insertData to send the data to the supabase API
                    insertData(fname, lname, gender, adr1, adr2, city, phonebrand, phoneprovider, studyphone);
                }).catch((error) => {
                    // If authentication fails, log the error and alert the user
                    console.error('Error authenticating user:', error);
                    alert('ERROR! Authentication failed, user account is not correct!');
                });
            });
            //--------------------------------------------------------
            //Function to authenticate the user with Supabase using email and password
            //--------------------------------------------------------
            async function authenticateUser(email, password) {
                try {
                    // Attempt to sign in the user with the provided email and password
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });
                    // Check for errors and log them to the console
                    if (error) {
                        console.error('Error authenticating user:', error);
                        return null;
                    }
                    // Return the authenticated user data
                    return data;
                } catch (error) {
                    // Log any unexpected errors to the console
                    console.error('Unexpected error during authentication:', error);
                    return null;
                }
            }
            //--------------------------------------------------------
            //"InsertData" function to insert the form data into the 'mobiletechnologyform' table
            //--------------------------------------------------------
            /*
            Asynchronous operation
            Read more: https://www.w3schools.com/xml/ajax_intro.asp
            JavaScript Async Promises: “then”
            Read more:
            https://www.w3schools.com/js/js_async_promises.asp
            JS Async “Promise”: A Promise
            represents the future result of an asynchronous
            operation. In this case, “promise” is “data”.
            Read more:
            https://www.w3schools.com/js/js_async_promi
            ses.asp
            */
            //Asynchronous function
            async function insertData(fname, lname, gender, adr1, adr2, city, phonebrand, phoneprovider, studyphone) {
                // Insert the data into the 'mobiletechnologyform' table in Supabase
                const { data, error } = await supabase
                .from('survey_data')
                .insert([{ fname: fname, lname: lname, gender: gender, adr1: adr1, adr2: adr2, city: city, phonebrand: phonebrand, phoneprovider: phoneprovider, studyphone: studyphone }]);
                // Check for errors and log them to the console
                if (error) {
                    console.error('Error inserting form data:', error);
                    alert('ERROR! INSERT FAILED!');
                    return null;
                }
                // Return the inserted data
                alert('Data (' + fname + ' ' + lname + ')' + ' inserted successfully!');
                return data;
            }
        </script>
